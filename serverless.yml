service: chess-education-api

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-northeast-2
  environment:
    GROQ_API_KEY: ${env:GROQ_API_KEY}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY}
    LICHESS_TOKEN: ${env:LICHESS_TOKEN}

functions:
  analyze-pgn:
    handler: api/analyze-pgn.handler
    events:
      - http:
          path: api/analyze-pgn
          method: post
  analyze:
    handler: api/analyze.handler
    events:
      - http:
          path: api/analyze
          method: post
  explorer:
    handler: api/explorer.handler
    events:
      - http:
          path: api/explorer
          method: post
  gemini:
    handler: api/gemini.handler
    events:
      - http:
          path: api/gemini
          method: post
  groq:
    handler: api/groq.handler
    events:
      - http:
          path: api/groq
          method: post
  lichess-proxy:
    handler: api/lichess-proxy.handler
    events:
      - http:
          path: api/lichess-proxy
          method: post
  lichess-token:
    handler: api/lichess-token.handler
    events:
      - http:
          path: api/lichess-token
          method: post
